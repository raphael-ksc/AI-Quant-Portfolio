<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Quant Portfolio</title>
  <meta http-equiv="refresh" content="0; url=./zh-TW/">
  <script>
    // 依瀏覽器語言導向：英文使用者 → en-AU，其餘 → zh-TW
    (function () {
      var lang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      var target = /^en/i.test(lang) ? './en-AU/' : './zh-TW/';
      window.location.replace(target);
    })();
  </script>
  <style>body{background:#000;color:#e6e6e6;font-family:ui-monospace,Consolas,monospace;padding:2rem}a{color:#ffa028}</style>
</head>
<body>
  <p><a href="./zh-TW/">繁體中文</a> · <a href="./en-AU/">English</a></p>
</body>
</html>
