# 推送到 main 時：測試 → 驗證打卡資料 → 敏感資訊掃描 → 建置網站 → 部署到 GitHub Pages
name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 一次性的 MySQL 容器，只給 tests/test_db_mysql.py 整合測試使用（帳密僅存在於這個 CI 容器）
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: quant_portfolio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: pip install pyyaml==6.0.3 pytest==9.1.1 pandas==3.0.6 pymysql==1.2.3

      - name: Unit and MySQL integration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci
          MYSQL_DATABASE: quant_portfolio
          MYSQL_TEST_DATABASE: quant_portfolio_test
        run: pytest tests -q -rs

      - name: Validate check-ins and build manifest
        run: python scripts/build_manifest.py

      - name: Scan for secrets
        run: python scripts/scan_secrets.py

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build static site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
