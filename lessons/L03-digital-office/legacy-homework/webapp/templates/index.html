<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quant Terminal · 自選股數據終端</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div class="terminal">

  <!-- 頂部列 -->
  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-mark">◆</span>
      <span data-i18n="site_title">量化自選股數據終端</span>
    </div>
    <nav class="topbar-nav">
      <a href="{{ url_for('screener_page') }}" data-i18n="nav_screener">多因子選股</a>
      <a href="{{ url_for('notes') }}" data-i18n="nav_notes">學習筆記</a>
      <a href="{{ url_for('about') }}" data-i18n="nav_about">架構說明</a>
      <button id="langToggle" class="lang-toggle" type="button">EN</button>
    </nav>
  </header>

  <div class="layout">

    <!-- 左側控制欄 -->
    <aside class="sidebar">
      <div class="sidebar-block">
        <p class="sidebar-label" data-i18n="label_ticker">選擇標的</p>
        <div class="ticker-list" id="tickerList">
          {% for code, cfg in tickers.items() %}
          <button class="ticker-item" data-ticker="{{ code }}" data-source="{{ cfg.source }}">
            <span class="ticker-code">{{ code }}</span>
            <span class="ticker-source">{{ cfg.source }}</span>
          </button>
          {% endfor %}
        </div>
      </div>

      <div class="sidebar-block">
        <p class="sidebar-label" data-i18n="label_timeframe">K線週期</p>
        <div class="timeframe-toggle">
          <button class="tf-btn active" data-timeframe="daily" data-i18n="tf_daily">日線</button>
          <button class="tf-btn" data-timeframe="minute" data-i18n="tf_minute">分鐘線</button>
        </div>
      </div>

      <button id="fetchBtn" class="fetch-btn" type="button" data-i18n="btn_fetch">
        抓取數據
      </button>

      <p id="statusLine" class="status-line"></p>
    </aside>

    <!-- 主要內容 -->
    <main class="main">
      <section class="chart-section">
        <div class="section-head">
          <h2 id="chartTitle" data-i18n="chart_placeholder">請選擇標的並按下「抓取數據」</h2>
          <span id="currencyTag" class="currency-tag"></span>
        </div>
        <div id="chartContainer" class="chart-container"></div>
      </section>

      <section class="financials-section">
        <div class="section-head">
          <h2 data-i18n="financials_title">季度財務數據（近 8 季）</h2>
        </div>
        <p id="granularityNote" class="granularity-note hidden"></p>
        <div class="table-wrap">
          <table id="financialsTable" class="financials-table">
            <thead><tr><th data-i18n="table_metric">科目</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

  </div>
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
